# ML auditory traits.

- type: trait
  id: MLParacusia
  category: Auditory
  points: 2
  functions:
    - !type:TraitAddComponent
      components:
        - type: Paracusia
          minTimeBetweenIncidents: 0.1
          maxTimeBetweenIncidents: 300
          maxSoundDistance: 7
          sounds:
            collection: Paracusia

- type: trait
  id: MLSnoring
  category: Auditory
  functions:
    - !type:TraitAddComponent
      components:
        - type: Snoring

- type: trait
  id: MLStomper
  category: Auditory
  points: 0
  requirements:
    - !type:CharacterTraitRequirement
      inverted: true
      traits:
        - MLSilentSteps
  functions:
    - !type:TraitReplaceComponent
      components:
        - type: FootstepVolumeModifier
          sprintVolumeModifier: 15
          walkVolumeModifier: 15

- type: trait
  id: MLSilentSteps
  category: Auditory
  points: -2
  requirements:
    - !type:CharacterTraitRequirement
      inverted: true
      traits:
        - MLStomper
  functions:
    - !type:TraitReplaceComponent
      components:
        - type: FootstepVolumeModifier
          sprintVolumeModifier: -10
          walkVolumeModifier: -10

- type: trait
  id: MLSinger
  category: Auditory
  points: -3
  requirements:
    - !type:CharacterTraitRequirement
      inverted: true
      traits:
        - MLMuted
  functions:
    - !type:TraitAddComponent
      components:
        - type: Singer
          proto: NormalSinger
