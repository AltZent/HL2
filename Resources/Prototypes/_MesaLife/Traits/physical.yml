        - MLCheapDrunk
  functions:
    - !type:TraitReplaceComponent
      components:
        - type: LightweightDrunk
          boozeStrengthMultiplier: 0.5

# --- Augmentation implants ---
# Generic body implants, lore-friendly for the HL2 setting: back-alley surgeons
# sell Combine tech and xen grafts. Future Alliance/Resistance roles can lock
# specific implants with CharacterJobRequirement entries.

- type: trait
  id: MLMechanicHands
  category: Physical
  points: -5
  requirements:
    - !type:CharacterTraitRequirement
      inverted: true
      traits:
        - MLAugDermalArmor
  functions:
    - !type:TraitAddComponent
      components:
        - type: Prying
          speedModifier: 0.75

- type: trait
  id: MLAugDermalArmor
  category: Physical
  points: -6
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
        - Human
    - !type:CharacterTraitRequirement
      inverted: true
      traits:
        - MLAugCombineArmor
        - MLAugBioShield
        - MLMechanicHands
  functions:
    - !type:TraitAddArmor
      damageModifierSets:
        - MLAugDermalArmor

# Military-grade implant: in lore issued to Combine soldiers, in practice
# available to anyone with enough points (future roles may restrict it).
- type: trait
  id: MLAugCombineArmor
  category: Physical
  points: -8
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
        - Human
    - !type:CharacterTraitRequirement
      inverted: true
      traits:
        - MLAugDermalArmor
        - MLAugBioShield
  functions:
    - !type:TraitAddArmor
      damageModifierSets:
        - MLAugCombineArmor

# Xen-biology graft: dangerous black-market surgery, resists exotic damage.
- type: trait
  id: MLAugBioShield
  category: Physical
  points: -8
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
        - Human
    - !type:CharacterTraitRequirement
      inverted: true
      traits:
        - MLAugDermalArmor
        - MLAugCombineArmor
        - MLWeakImmunity
  functions:
    - !type:TraitAddArmor
      damageModifierSets:
        - MLAugBioShield
