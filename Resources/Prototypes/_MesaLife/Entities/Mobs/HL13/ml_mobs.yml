  name: "Headcrab"
  description: "A parasitic headcrab."
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.6
    baseSprintSpeed: 4.16
  - type: Sprite
    drawdepth: Mobs
    sprite: _MesaLife/Mobs/ML/halflife.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: headcrab
