- type: entity
  id: MLGrenadeCSGas
  name: "CS gas grenade"
  description: "A grenade which unleashes a slow spreading cloud of CS gas upon detonation. Works to nonlethally disable targets who aren't wearing a gas mask, but be careful with how long it lingers indoors."
  parent: BaseMLGrenade
  components:
  - type: Sprite
    sprite: _MesaLife/Weapons/ML/Throwables/grenade.rsi
    layers:
    - state: csgas
      map: ["enum.TriggerVisualLayers.Base"]
  - type: Item
    sprite: _MesaLife/Weapons/ML/Throwables/MLGrenInhand/csgas.rsi
  - type: OnUseTimerTrigger
    delay: 3.5
    beepSound:
      path: /Audio/Effects/beep1.ogg
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 2
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: csgas_active }
          Unprimed: { state: csgas }
  - type: SmokeOnTrigger
    duration: 10
    spreadAmount: 30
    solution:
      reagents:
      - ReagentId: TearGas
        Quantity: 50
  - type: SoundOnTrigger
    sound:
      path: /Audio/Items/smoke_grenade_smoke.ogg
  - type: DeleteOnTrigger

