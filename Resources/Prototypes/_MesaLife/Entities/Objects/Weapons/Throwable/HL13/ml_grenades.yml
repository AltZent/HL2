# Auto-generated ML grenades (halflife-episode13).

- type: entity
  id: BaseMLGrenade
  parent: GrenadeBase
  abstract: true
  components:
  - type: Clothing
    quickEquip: false
    slots:
    - Belt

- type: entity
  id: MLGrenadeBouncer
  name: "MK3A2 grenade"
  description: "Called a 'Bouncer' or 'Extractor' by Combine teams, these grenades are designed for flushing out enemy combatants via shrapnel, and a powerful though short ranged explosion."
  parent: BaseMLGrenade
  components:
  - type: Sprite
    sprite: _MesaLife/Weapons/ML/Throwables/grenade.rsi
    layers:
    - state: bouncer
      map: ["enum.TriggerVisualLayers.Base"]
  - type: Item
    sprite: _MesaLife/Weapons/ML/Throwables/MLGrenInhand/bouncer.rsi
  - type: OnUseTimerTrigger
    delay: 3.5
    beepSound:
      path: /Audio/Effects/beep1.ogg
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 2
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: bouncer_active }
          Unprimed: { state: bouncer }
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 120
    intensitySlope: 5
    maxIntensity: 10
    canCreateVacuum: false

- type: entity
  id: MLGrenadeBouncerRandom
  name: "MK3A2 grenade (random timer)"
  description: "Called a 'Bouncer' by Combine teams, these grenades are designed for flushing out enemy combatants via shrapnel, and a powerful though short ranged explosion. This one has a randomized timer, don't hold onto it!"
  parent: BaseMLGrenade
  components:
  - type: Sprite
