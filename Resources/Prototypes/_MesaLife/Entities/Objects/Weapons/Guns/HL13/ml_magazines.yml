# Auto-generated ML magazines (halflife-episode13).

- type: entity
  id: BaseMagazineML
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
    - Magazine
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container

- type: entity
  id: MagazineMLUSP9mm
  name: "pistol magazine (9mm)"
  parent: BaseMagazineML
  components:
  - type: Sprite
    sprite: _MesaLife/Weapons/ML/Guns/MLMags/usp.rsi
    layers:
    - state: mag-0
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Tag
    tags:
    - Magazine
    - MagazineMLUSP
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeMLPistol9mm
    capacity: 15
    proto: CartridgeML9mmUSP
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

