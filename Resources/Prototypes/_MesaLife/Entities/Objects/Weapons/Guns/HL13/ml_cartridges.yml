# Auto-generated ML cartridges (halflife-episode13).

- type: entity
  id: BaseCartridgeML
  parent: BaseCartridge
  abstract: true

- type: entity
  id: BaseCartridgeMLCased
  parent: BaseCartridgeML
  abstract: true
  components:
  - type: CartridgeAmmo
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  id: BaseCartridgeMLCaseless
  parent: BaseCartridgeML
  abstract: true
  components:
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: base
    suffix: false

