# Auto-generated ML firearms (halflife-episode13).

- type: entity
  id: BaseMLGun
  parent: BaseItem
  abstract: true
  components:
  - type: AmmoCounter
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireOnDropChance: 0.15
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: MeleeWeapon
    attackRate: 1.2
    damage:
      types:
        Blunt: 7
    swapKeys: true
    disableHeavy: true
    animation: WeaponArcThrust
    wideAnimationRotation: 135
    soundHit:
      collection: MetalThud
  - type: Clothing
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: StaticPrice
    price: 350
  - type: Appearance

- type: entity
  id: BaseMLChamberGun
  parent: BaseMLGun
  abstract: true
  components:
  - type: ChamberMagazineAmmoProvider
    soundBoltInserted:
      path: /Audio/Weapons/Guns/Bolt/rifle_bolt_open.ogg
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
      gun_chamber:
        name: Chamber
        priority: 1
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot

- type: entity
  id: BaseMLTubeGun
  parent: BaseMLGun
  abstract: true
  components:
  - type: BallisticAmmoProvider
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  id: BaseMLRevolver
  parent: BaseMLGun
  abstract: true
  components:
  - type: UseDelay
    delay: 0.8
  - type: ContainerContainer
    containers:
      revolver-ammo: !type:Container
  - type: RevolverAmmoProvider
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg

- type: entity
  id: BaseMLEnergyGun
  parent: BaseMLGun
  abstract: true
  components:
  - type: Battery

- type: entity
  id: BaseMLWieldable
  abstract: true
  components:
  - type: Wieldable
  - type: GunRequiresWield

- type: entity
