- type: entity
  id: MLWallBrick
  parent: BaseWall
  name: "brick wall (ML)"
  description: "A wall from Half-Life: Episode 13."
  components:
  - type: Transform
    noRot: true
  - type: Icon
    sprite: _MesaLife/Structures/ML/Walls/brick.rsi
    state: wall-0
  - type: Sprite
    sprite: _MesaLife/Structures/ML/Walls/brick.rsi
    state: wall-0
  - type: IconSmooth
    key: mlwall
    base: wall-
    mode: CardinalFlags
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
