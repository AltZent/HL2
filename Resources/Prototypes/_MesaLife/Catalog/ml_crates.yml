# ML filled crates, MesaLife. Plain vanilla crate base — keep MesaLife
# self-contained (no N14 parents). Ordered via cargo (see ml_cargo.yml),
# also usable directly in map storage fills.

- type: entity
  parent: CrateGeneric
  id: MLCrateFilledAmmo9mm
  name: 9mm ammo crate
  description: A battered steel crate of surplus 9mm rounds.
  components:
  - type: StorageFill
    contents:
      - id: AmmoBoxML9mm
        amount: 2
      - id: MagazineMLUSP9mm
        amount: 4
      - id: MagazineMLMP7
        amount: 2

- type: entity
  parent: CrateGeneric
  id: MLCrateFilledAmmo46mm
  name: 4.6mm ammo crate
  description: Combine-caliber SMG rounds in a sealed surplus crate.
  components:
  - type: StorageFill
    contents:
      - id: AmmoBoxML46mm
        amount: 2
      - id: MagazineMLMP7
        amount: 4

- type: entity
